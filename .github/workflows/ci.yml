name: CI
on: [push, pull_request]

# Least privilege: the workflow only needs to read the repo. Without an
# explicit block the default GITHUB_TOKEN scopes apply (wider than needed).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      # Actions are pinned to commit SHAs (the tag is in a comment) so a moved
      # or compromised tag cannot change what runs here. Same pins as
      # .github/workflows/publish.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
